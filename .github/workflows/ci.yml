name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Testes unitários + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes (com gate de cobertura do domínio)
        run: pnpm exec turbo run test --output-logs=errors-only

      - name: Typecheck
        run: pnpm exec turbo run typecheck

  security:
    name: Audit de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Audit de dependências de produção
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true # gate endurecido a partir da F5
